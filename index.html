<div class="settings-card preferences-card">
    <div>
        <strong>Gemini Model</strong>
        <p>Pilih model AI untuk percakapan NEX AI.</p>
    </div>

    <div class="preference-fields">
        <label>Model AI
            <select id="geminiModelSelect">
                <optgroup label="Gemini 4">
                    <option value="gemini-4-hydrogen">Gemini 4 Hydrogen</option>
                    <option value="gemini-4-argon">Gemini 4 Argon</option>
                    <option value="gemini-4-carbon">Gemini 4 Carbon</option>
                </optgroup>

                <optgroup label="Gemini 3">
                    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                    <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                    <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                    <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                </optgroup>
            </select>
        </label>

        <span id="geminiModelStatus" class="setting-badge">
            Model default
        </span>

        <p class="model-note">
            Ketersediaan model bergantung pada akses API dan paket akun.
        </p>
    </div>
</div>
